name: Release
permissions:
    contents: write

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to create and release (e.g. v0.1.0)"
                required: true
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"

env:
    BINARY_NAME: flowsurface-server
    INCLUDE_FILES: README.md LICENSE config.example.toml

jobs:
    build:
        name: ${{ matrix.target.name }}
        strategy:
            fail-fast: false
            matrix:
                target:
                    - name: linux-x86_64
                      os: ubuntu-latest
                      target_triple: x86_64-unknown-linux-gnu
                    - name: linux-aarch64
                      os: ubuntu-24.04-arm
                      target_triple: aarch64-unknown-linux-gnu
                    - name: macos-x86_64
                      os: macos-13
                      target_triple: x86_64-apple-darwin
                    - name: macos-aarch64
                      os: macos-latest
                      target_triple: aarch64-apple-darwin
        runs-on: ${{ matrix.target.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target.target_triple }}

            - name: Build release
              run: cargo build --release --target ${{ matrix.target.target_triple }}

            - name: Package archive
              id: package
              shell: bash
              run: |
                  ARCHIVE_NAME="${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target.target_triple }}.tar.gz"
                  STAGING="${{ runner.temp }}/staging"
                  mkdir -p "$STAGING"

                  cp "target/${{ matrix.target.target_triple }}/release/${{ env.BINARY_NAME }}" "$STAGING/"
                  for file in ${{ env.INCLUDE_FILES }}; do
                    [ -f "$file" ] && cp "$file" "$STAGING/"
                  done

                  cd "$STAGING"
                  tar czf "${{ runner.temp }}/$ARCHIVE_NAME" .
                  echo "archive_path=${{ runner.temp }}/$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.target.name }}
                  path: ${{ steps.package.outputs.archive_path }}

    release:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Determine tag
              id: tag
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Generate checksums
              run: |
                  cd artifacts
                  find . -type f -exec sha256sum {} \; | sed 's|\./||' > SHA256SUMS
                  cat SHA256SUMS

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  name: ${{ steps.tag.outputs.tag }}
                  draft: true
                  files: |
                      artifacts/**/*
