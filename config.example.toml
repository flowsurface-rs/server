bind_address = "127.0.0.1:8080"
data_dir = "./data"

# Domain name for the self-signed TLS certificate's SAN (Subject Alternative Names).
# Ignored on loopback binds (plain HTTP).  Default: "flowsurface-server".
# tls_domain = "data.example.com"

# Trade batch-flush interval in milliseconds.
# Lower values reduce data loss on crash/failure; higher values are more I/O-efficient
# (fewer fsyncs, larger columnar batches).  Default: 2000 (2 seconds).
# flush_interval_ms = 2000

# Data retention period in hours.  Trades older than this will be purged
# on startup (and periodically while running).  Default: 48 (2 days).
# data_retention_hours = 48

# Base assets to track — expanded via the whitelist templates below.
# The server fetches exchange metadata and resolves pairs at startup.
base_assets = ["BTC", "ETH"]

# Whitelist templates: per-venue, per-market-kind list of quote assets.
# To exclude a venue entirely, omit it from the whitelist.
# To exclude a market kind for a venue, omit that key.
#
# Tip: `http(s)://<bind_address>/exchanges` shows all available tickers that can be tracked. 
# use `[""]` (empty string) as a wildcard to track all `base_assets` regardless of the quote on that venue+market
#
# Discovery mode: fetches and caches metadata for ALL supported exchanges on startup
# so `/exchanges` is fully populated.  Lets you browse available tickers
# before deciding what to track.  Default: true.
# discovery_mode = true

[whitelist.binance]
spot = ["USDT"]
linear = ["USDT", "USDC"]
inverse = ["USD"]

[whitelist.bybit]
spot = ["USDT"]
linear = ["USDT"]

[whitelist.hyperliquid]
linear = ["USDC"]

[whitelist.okex]
spot = ["USDT"]
linear = ["USDT"]