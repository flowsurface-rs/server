[network]
# Where the API listens.  Change to any non-loopback address for remote
# access (auto-generates TLS cert + auth token).
# Default: 127.0.0.1:8080.
bind_address = "127.0.0.1:8080"

# Per-IP token-bucket rate limiter.  Each IP can burst up to
# `max_requests` requests instantly; sustained throughput is
# limited to `max_requests / 10` req/s (tokens refill continuously).
# Set to 0 to disable entirely (not recommended if the API is
# exposed to the internet — even for personal use a runaway
# client can saturate the server).
# Default: 500 req/10s per IP (burst 500, sustained ≈ 50 req/s).
# max_requests = 500

# Domain name for the self-signed TLS certificate's SAN.
# Only needed when connecting via a domain with verified TLS.
# Default: "flowsurface-server".
# tls_domain = "data.example.com"

[storage]
# Directory for DuckDB database, auth token, and TLS certs.
# Relative paths are resolved from the config file's directory.
# Default: "data".
data_dir = "data"

# Hard cap on total DuckDB storage (database + WAL).
# When exceeded the oldest trades are purged during cleanup —
# even if they're within the time-based retention window.
# Set to 0 to disable the cap entirely.
# Default: 4096 MiB (4 GiB).
max_storage_mb = 4096

# Data retention period in hours.  Trades older than this are
# purged on startup and periodically while running.
# Set to 0 to keep all trades indefinitely (disk-permitting).
# Default: 168 (7 days).
data_retention_hours = 168

# Trade batch-flush interval in milliseconds.
# Higher values = fewer disk writes (more I/O efficient).
# Lower values = trades appear in the DB sooner (at more write cost).
# Default: 2000 (2 seconds).
# flush_interval_ms = 2000

# Maximum trades to buffer in memory before dropping (OOM guard).
# 200k trades ≈ 20-40 MB — safe for hosts with 1 GB+ RAM.
# Default: 200000.
# max_buffered_trades = 200000

[pairs]
# Expand base_assets × quote_assets from the whitelist templates
# below.  The server resolves exchange-specific ticker strings
# (handling separators, _PERP, -SWAP suffixes, etc.).
# Pairs are only tracked when BOTH a base asset AND a matching
# whitelist entry exist.
# Default: [] (no pairs tracked).
base_assets = ["BTC", "ETH"]

# Discovery mode: fetches metadata for ALL supported exchanges on
# startup so /exchanges is fully populated.
# If false, only fetch metadata for whitelisted venues.
# Default: true.
# discovery_mode = true

# ── Whitelist ───────────────────────────────────────────────────
# Exchange-specific market tracking.  Each [whitelist.venue] section
# lists market_kind = ["quote_assets"] pairs.
#
# Tip: to include every ticker with a matching base asset regardless
# of quote currency, use an empty string: linear = [""]

[whitelist.binance]
spot = ["USDT"]
linear = ["USDT", "USDC"]
inverse = ["USD"]

[whitelist.bybit]
spot = ["USDT"]
linear = ["USDT"]

[whitelist.hyperliquid]
linear = ["USDC"]

[whitelist.okex]
spot = ["USDT"]
linear = ["USDT"]