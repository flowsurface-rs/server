[package]
name = "flowsurface-server"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/flowsurface-rs/server"

[dependencies]
# HTTP / async runtime / concurrency
axum = { version = "0.8.9", default-features = false, features = ["query", "tokio", "http1"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "signal", "net", "time"] }
futures = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
parking_lot = "0.12.5"
tower-service = "0.3.3"

# TLS (self-signed cert. generation & runtime provider)
rcgen = "0.14.8"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
sha2 = "0.11"
base64 = "0.23"

# Exchange WebSocket adapters
flowsurface-exchange = { git = "https://github.com/flowsurface-rs/flowsurface.git", rev = "1e30016ed34dbe5bb333ab869d6454f926af6e83", package = "flowsurface-exchange" }

# Storage
duckdb = { version = "1.10505", features = ["bundled"] }
rustc-hash = "2.1.3"

# Arrow IPC (zero-copy columnar transport)
arrow = { version = "58.4", default-features = false, features = ["ipc"] }

# Serialization
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

# CLI argument parsing
clap = { version = "4", default-features = false, features = ["derive", "std"] }

# Environment / config
dotenvy = { version = "0.15", default-features = false }
getrandom = { version = "0.2", default-features = false, features = ["std"] }

# Logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }

# Error handling
anyhow = "1.0.104"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
